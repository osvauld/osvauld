[package]
name = "transport"
version = "0.1.0"
edition = "2021"
description = "Pure P2P transport layer for Osvauld (iroh-based)"
license = "MIT"

[dependencies]
# Networking - match network crate versions
iroh = "0.96.0"
iroh-base = "0.96.0"
iroh-blobs = "0.98.0"

# Hashing
blake3 = "1.5"

# Async
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Byte buffers (for datagrams)
bytes = "1.5"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Base64 for connection strings
base64 = "0.22"

# Hex encoding for debug output
hex = "0.4"
