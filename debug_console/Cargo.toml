[package]
name = "debug_console"
version = "0.1.0"
edition = "2021"
description = "egui-based debug console for Sthalam apps"

[[bin]]
name = "debug_console"
path = "src/main.rs"

[dependencies]
# GUI
eframe = "0.29"
egui = "0.29"

# Async and networking
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
