[package]
name = "app_test"
version = "0.1.0"
edition = "2021"
description = "Lightweight test runner for Osvauld Lua apps"
license = "MIT"

[dependencies]
# Lua runtime (our core dependency)
lua_runtime = { path = "../lua_runtime" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async (for mpsc channels)
tokio = { version = "1", features = ["sync"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Slint renderer (for visual examples)
renderer_slint = { path = "../renderer_slint" }

# Slint (for event loop in examples)
slint = { version = "1.14", features = ["backend-winit", "renderer-femtovg"] }

[[example]]
name = "visual_test"
path = "examples/visual_test.rs"
