[package]
name = "ai_interface"
version = "0.1.0"
edition = "2021"
description = "AI interface for app automation - works with Claude, local LLMs, etc."

[[bin]]
name = "ai_interface"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "process", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
