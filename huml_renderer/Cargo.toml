[package]
name = "huml_renderer"
version = "0.1.0"
edition = "2021"
description = "HUML template renderer with dependency-tracked reactivity"

[dependencies]
# Query bridge for data access
query_bridge = { path = "../query_bridge" }

# CEL evaluation
cel_runtime = { path = "../cel_runtime" }

# Data types
butler = { path = "../butler" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"

# Layout engine
taffy = "0.9"

# Collections
indexmap = "2"

# GPU rendering
vello = "0.6"
peniko = "0.5"  # Color/brush types for vello

# Font handling
parley = "0.7"  # Text layout

# Windowing (for integration)
winit = "0.30"
wgpu = "26"  # Must match vello's wgpu version

# Async blocking
pollster = "0.4"
