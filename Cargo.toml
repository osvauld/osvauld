[workspace]
resolver = "2"
members = [
  "policy_model",
  "osv_decl",
  "domains",
  "scribe",
  "gurkha",
  "kunki",
  "logging_utils",
  "butler",
  "herald",
  "transport",
  "courier",
  "control_server",
  "lua_runtime",
  # New crates for multi-renderer architecture
  "renderer_slint",
  "renderer_raylib",
  "widgets",
  "sthalam_shell",
  "sthalam",
  "integration_tests",
]

# Speed up dev builds
[profile.dev]
split-debuginfo = "unpacked" # Faster debug info on Linux
incremental = true

# Optimize dependencies but not our code (speeds up without losing debuggability)
[profile.dev.package."*"]
opt-level = 1

# Release with debug symbols (for flamegraph profiling)
[profile.profiling]
inherits = "release"
debug = true

# Workspace dependencies to fix feature resolution issues
[workspace.dependencies]
zerovec = { version = "0.11", features = ["alloc"] }
criterion = { version = "0.5", features = ["async_tokio"] }
console-subscriber = "0.5"
tracing-flame = "0.2"
