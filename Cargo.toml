[workspace]
resolver = "2"
members = [
  "sthalam/src-tauri",
  "gurkha",
  "kunki",
  "tauri_handlers",
  "logging_utils",
  "butler",
  "herald",
  "transport",
  "courier",
  "integration_tests",
]

# Speed up dev builds
[profile.dev]
split-debuginfo = "unpacked"  # Faster debug info on Linux
incremental = true

# Optimize dependencies but not our code (speeds up without losing debuggability)
[profile.dev.package."*"]
opt-level = 1
