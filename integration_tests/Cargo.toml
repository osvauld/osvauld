[package]
name = "integration_tests"
version = "0.1.0"
edition = "2021"
description = "Protocol integration tests for Osvauld P2P"
license = "MIT"

[dependencies]
# Internal crates
courier = { path = "../courier" }
butler = { path = "../butler" }
transport = { path = "../transport" }
gurkha = { path = "../gurkha", features = ["test-support"] }
herald = { path = "../herald" }
domains = { path = "../domains" }
lua_runtime = { path = "../lua_runtime" }
scribe = { path = "../scribe" }

# JSON
serde_json = "1"

# CRDT
loro = "1.5.4"

# Encoding
base64 = "0.22"

# Actor framework
ractor = "0.14"

# Async
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }

# Testing utilities
tempfile = "3"

# Lua runtime for validation tests
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
