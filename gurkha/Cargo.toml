[package]
name = "gurkha"
version = "0.1.0"
edition = "2021"

[dependencies]
# UCAN library
ucan = "0.4.0"

# Crypto primitives (for raw Ed25519 keys only)
ed25519-dalek = "2.1"

# CRDT library for merge logic
loro = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encoding
base64 = "0.22"
bs58 = "0.5"

# Async
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = { version = "0.1", features = ["attributes"] }

# Time (for token expiry)
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
