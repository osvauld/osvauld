[package]
name = "slint_shell"
version = "0.1.0"
edition = "2021"
description = "Sthalam shell UI built with Slint"

[dependencies]
slint = { version = "1.14", features = ["backend-winit", "renderer-skia"] }
butler = { path = "../butler" }
courier = { path = "../courier" }
app_runtime = { path = "../app_runtime" }
logging_utils = { path = "../logging_utils" }
arboard = "3"
dirs = "5.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
ractor = "0.14"
rfd = "0.15"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
slint-build = "1.14"
