[package]
name = "slint_shell"
version = "0.1.0"
edition = "2021"
description = "Sthalam shell UI built with Slint"

[features]
default = []
testing = ["slint/backend-qt"]  # For headless testing

[dependencies]
slint = { version = "1.14", features = ["backend-winit", "renderer-femtovg"] }
slint-interpreter = "1.14"
i-slint-backend-testing = "1.14"
walkdir = "2"
butler = { path = "../butler" }
courier = { path = "../courier" }
app_runtime = { path = "../app_runtime" }
logging_utils = { path = "../logging_utils" }
control_server = { path = "../control_server" }
arboard = "3"
dirs = "5.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
ractor = "0.14"
rfd = "0.15"
mime_guess = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
slint-build = "1.14"
