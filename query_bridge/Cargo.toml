[package]
name = "query_bridge"
version = "0.1.0"
edition = "2021"
description = "Query-based data access bridge between HUML renderer and Scribe"

[dependencies]
# Data types from butler
butler = { path = "../butler" }

# CEL is being replaced by Rune runtime (stub in lib.rs)

# Async runtime
tokio = { version = "1", features = ["sync", "rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"

# Actor framework (for Scribe bridge)
ractor = "0.14"
