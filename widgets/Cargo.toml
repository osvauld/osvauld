[package]
name = "widgets"
version = "0.1.0"
edition = "2021"
description = "Osvauld native widget primitives (RichTextEdit, VideoSurface) exposed to Lua apps via Slint @osvauld/widgets library"

[dependencies]
slint = { version = "1.16", features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }
slint-interpreter = "1.16"

# Rich text shaping/layout (used by RichTextEdit). Pulled in now so the
# dep graph is settled; actual parley wiring lands in milestone 2.
parley = "0.9"

# CRDT-backed document state.
loro = "1.5"

tracing = "0.1"
