[package]
name = "sthalam"
version = "0.1.0"
description = "A peer to peer collaborative website and document publisher"
authors = ["Abraham"]
edition = "2024"

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.

[lib]
name = "sthalam"
crate-type = [
  "lib",
  "cdylib",
] # Removed staticlib - not needed for Tauri, speeds up linking

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }
cc = "1.2.47"

[dependencies]
# New architecture crates
tauri_handlers = { path = "../../tauri_handlers" }
butler = { path = "../../butler" }
herald = { path = "../../herald" }
transport = { path = "../../transport" }
courier = { path = "../../courier" }
# Tauri
tauri = { version = "2.9.3", features = ["protocol-asset"] }
tauri-plugin-shell = "2.2.1"
tauri-plugin-store = "2.2.0"
tauri-plugin-clipboard-manager = "2.0.2"

# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.44.2", features = ["sync"] }
anyhow = "1.0.91"
thiserror = "2.0.0"

# Utilities
logging_utils = { path = "../../logging_utils" }
tracing = "0.1"
log = "0.4"
once_cell = "1.8"
uuid = { version = "1.3.0", features = ["v4"] }
chrono = "0.4.38"
base64 = "0.22.1"
rand = "0.8.5"
url = "2.5.4"
sys-locale = "0.3.1"
tauri-plugin-fs = "2.2.1"
tauri-plugin-dialog = "2.0.0-rc"
clap = { version = "4.5.40", features = ["derive"] }
mime_guess = "2.0"
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.0.0-rc"
