[package]
name = "sthalam"
version = "0.1.0"
description = "A peer to peer collaborative website and document publisher"
authors = ["Abraham"]
edition = "2024"


[profile.dev]
incremental = true # Compile your binary in smaller steps.
[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.

[lib]
name = "sthalam"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
cc = "1.2.29"

[dependencies]
network = { path = "../../network" }
tauri_handlers = { path = "../../tauri_handlers" }
tauri-plugin-shell = "2.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.2.0"
crypto_utils = { path = "../../crypto_utils" }
once_cell = "1.8"
log = "0.4"
tauri-plugin-log = "2.3.1"
tauri-plugin-clipboard-manager = "2.0.2"
tokio = { version = "1.44.2", features = ["full"] }
uuid = { version = "1.3.0", features = ["v4"] }
rcgen = "0.14.2"
anyhow = "1.0.91"
futures-lite = "2.3.0"
sys-locale = "0.3.1"
chrono = "0.4.38"
async-trait = "0.1.83"
thiserror = "2.0.0"
url = "2.5.4"
rand = "0.8.5"
base64 = "0.22.1"
osvauld_core = { path = "../../core" }
persistance = { path = "../../persistance" }
services = { path = "../../services" }
search_indexer = { path = "../../search_indexer" }
tauri = { version = "2.4.1", features = ["protocol-asset"] }
tauri-plugin-fs = "2.2.1"
loro = "1.5"
tauri-plugin-dialog = "2.0.0-rc"
clap = { version = "4.5.40", features = ["derive"] }
regex = "1.11.1"
quick-xml = "0.38.1"
mime_guess = "2.0"
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.0.0-rc"
