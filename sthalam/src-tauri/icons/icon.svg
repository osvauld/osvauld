<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Background - Sthalam Dark -->
  <rect width="400" height="500" fill="#0D0E13"/>

  <!-- Ground - Same as Background -->
  <rect x="0" y="400" width="400" height="100" fill="#0D0E13"/>
  
  <!-- Tree Trunk - Light Dark Shade -->
  <rect x="180" y="300" width="20" height="20" fill="#2F303E"/>
  <rect x="200" y="300" width="20" height="20" fill="#2F303E"/>
  <rect x="180" y="320" width="20" height="20" fill="#2F303E"/>
  <rect x="200" y="320" width="20" height="20" fill="#2F303E"/>
  <rect x="180" y="340" width="20" height="20" fill="#2F303E"/>
  <rect x="200" y="340" width="20" height="20" fill="#2F303E"/>
  <rect x="180" y="360" width="20" height="20" fill="#2F303E"/>
  <rect x="200" y="360" width="20" height="20" fill="#2F303E"/>
  <rect x="180" y="380" width="20" height="20" fill="#2F303E"/>
  <rect x="200" y="380" width="20" height="20" fill="#2F303E"/>
  
  <!-- Tree Foliage - Sthalam Purple -->
  <!-- Bottom Layer -->
  <rect x="140" y="280" width="20" height="20" fill="#cba6f7"/>
  <rect x="160" y="280" width="20" height="20" fill="#cba6f7"/>
  <rect x="180" y="280" width="20" height="20" fill="#cba6f7"/>
  <rect x="200" y="280" width="20" height="20" fill="#cba6f7"/>
  <rect x="220" y="280" width="20" height="20" fill="#cba6f7"/>
  <rect x="240" y="280" width="20" height="20" fill="#cba6f7"/>
  
  <rect x="120" y="260" width="20" height="20" fill="#cba6f7"/>
  <rect x="140" y="260" width="20" height="20" fill="#cba6f7"/>
  <rect x="160" y="260" width="20" height="20" fill="#cba6f7"/>
  <rect x="180" y="260" width="20" height="20" fill="#cba6f7"/>
  <rect x="200" y="260" width="20" height="20" fill="#cba6f7"/>
  <rect x="220" y="260" width="20" height="20" fill="#cba6f7"/>
  <rect x="240" y="260" width="20" height="20" fill="#cba6f7"/>
  <rect x="260" y="260" width="20" height="20" fill="#cba6f7"/>
  
  <!-- Middle Layer -->
  <rect x="120" y="240" width="20" height="20" fill="#cba6f7"/>
  <rect x="140" y="240" width="20" height="20" fill="#cba6f7"/>
  <rect x="160" y="240" width="20" height="20" fill="#cba6f7"/>
  <rect x="180" y="240" width="20" height="20" fill="#cba6f7"/>
  <rect x="200" y="240" width="20" height="20" fill="#cba6f7"/>
  <rect x="220" y="240" width="20" height="20" fill="#cba6f7"/>
  <rect x="240" y="240" width="20" height="20" fill="#cba6f7"/>
  <rect x="260" y="240" width="20" height="20" fill="#cba6f7"/>
  
  <rect x="140" y="220" width="20" height="20" fill="#cba6f7"/>
  <rect x="160" y="220" width="20" height="20" fill="#cba6f7"/>
  <rect x="180" y="220" width="20" height="20" fill="#cba6f7"/>
  <rect x="200" y="220" width="20" height="20" fill="#cba6f7"/>
  <rect x="220" y="220" width="20" height="20" fill="#cba6f7"/>
  <rect x="240" y="220" width="20" height="20" fill="#cba6f7"/>
  
  <!-- Top Layer -->
  <rect x="160" y="200" width="20" height="20" fill="#cba6f7"/>
  <rect x="180" y="200" width="20" height="20" fill="#cba6f7"/>
  <rect x="200" y="200" width="20" height="20" fill="#cba6f7"/>
  <rect x="220" y="200" width="20" height="20" fill="#cba6f7"/>
  
  <rect x="160" y="180" width="20" height="20" fill="#cba6f7"/>
  <rect x="180" y="180" width="20" height="20" fill="#cba6f7"/>
  <rect x="200" y="180" width="20" height="20" fill="#cba6f7"/>
  <rect x="220" y="180" width="20" height="20" fill="#cba6f7"/>
  
  <!-- Tree Top -->
  <rect x="180" y="160" width="20" height="20" fill="#cba6f7"/>
  <rect x="200" y="160" width="20" height="20" fill="#cba6f7"/>
  
  <rect x="180" y="140" width="20" height="20" fill="#cba6f7"/>
  <rect x="200" y="140" width="20" height="20" fill="#cba6f7"/>
  
  <rect x="190" y="120" width="20" height="20" fill="#cba6f7"/>
