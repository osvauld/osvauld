[package]
name = "osvauld_services"
version = "0.1.0"
edition = "2024"
description = "Service layer for Osvauld application"

[dependencies]
osvauld_core = { path = "../core" }
crypto_utils = { path = "../crypto_utils" }
osvauld_db = { path = "../osvauld-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1.40.0", features = ["sync"] }
thiserror = "2.0.0"
rand = "0.8.5"
base64 = "0.22.1"
