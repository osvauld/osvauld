[package]
name = "alchemist"
version = "0.1.0"
edition = "2021"
description = "Cryptographic transformations for Osvauld - AES-GCM, ECDH, HKDF"
license = "MIT"

[dependencies]
# Symmetric encryption
aes-gcm = "0.10"

# Key derivation (for session keys from ECDH, not passwords)
hkdf = "0.12"
sha2 = "0.10"

# X25519 key exchange
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Randomness
rand = "0.8"

# Error handling
thiserror = "2.0"

# Secure memory
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
