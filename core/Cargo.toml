[package]
name = "osvauld_core"
version = "0.1.0"
edition = "2024"
description = "Core domain models and repository interfaces for Osvauld"
license = "MIT"

[dependencies]
async-trait = "0.1.87"
chrono = "0.4.40"
log = "0.4.27"


serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.15.1", features = ["v4"] }
yrs = { version = "0.23.1", features = ["sync"] }
