[package]
name = "osvauld_core"
version = "0.1.0"
edition = "2024"
description = "Core domain models and repository interfaces for Osvauld"
license = "MIT"

[dependencies]
async-trait = "0.1.87"
base64 = "0.22.1"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.15.1", features = ["v4"] }
loro = "1.5"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
bs58 = "0.5.1"
anyhow = "1.0.98"
rand = "0.8.5"
chrono = "0.4.41"
crypto_utils = { path = "../crypto_utils" }
