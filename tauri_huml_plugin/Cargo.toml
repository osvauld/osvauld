[package]
name = "tauri_huml_plugin"
version = "0.1.0"
edition = "2021"
description = "HUML rendering plugin for Tauri - enables native GPU-rendered template windows"

[dependencies]
# Tauri (for state management)
tauri = { version = "2.9", features = ["unstable"] }

# HUML Renderer
huml_renderer = { path = "../huml_renderer" }

# CEL Runtime
cel_runtime = { path = "../cel_runtime" }

# GPU rendering and windowing (for native HUML windows)
vello = "0.6"
winit = "0.30"
wgpu = "26"

# Utilities
anyhow = "1"
tracing = "0.1"
pollster = "0.4"
serde_json = "1"

# Thread communication
crossbeam-channel = "0.5"

# Force zerovec alloc feature (required by icu_properties via tauri's url dep)
zerovec = { version = "0.11", features = ["alloc"] }
