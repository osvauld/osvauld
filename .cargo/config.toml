# Use mold linker for faster linking times during development
# Commented out for cross-compilation compatibility
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/mold"]

# Cross-compilation targets
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

# Optional: Enable parallel frontend for faster compilation
[build]
jobs = 8  # Adjust based on your CPU cores
