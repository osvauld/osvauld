[package]
name = "crypto_utils"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]
name = "crypto_utils"
path = "src/lib.rs"

[dependencies]
sequoia-openpgp = { version = "2.0.0", features = [
  "crypto-nettle",
  "compression",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
anyhow = "1.0"
argon2 = "0.5.0"
rand = "0.8.5"
aes-gcm = "0.10.3"
thiserror = "2.0.12"
ed25519-dalek = "2.1.1"
log = "0.4.27"
