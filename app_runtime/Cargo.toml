[package]
name = "app_runtime"
version = "0.1.0"
edition = "2021"
description = "Runtime for loading and executing Slint + Lua app bundles"

[dependencies]
# Slint interpreter for dynamic .slint loading
slint-interpreter = "1.9"
slint = "1.9"

# Lua scripting (sandboxed)
mlua = { version = "0.10", features = ["lua54", "vendored", "async", "send"] }

# Async
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Fast mutex (no poison, simpler API)
parking_lot = "0.12"

# Butler integration for loading apps from storage
butler = { path = "../butler" }

# Loro CRDT for direct FFI access
loro = "1.5"

# Temp directory for Slint compilation
tempfile = "3"

# Actor framework for Scribe communication
ractor = "0.14"

# Graph layout algorithms for canvas apps
layout-rs = "0.1"
