[package]
name = "kunki"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kunki"
path = "src/main.rs"

[dependencies]
# Core dependencies from the original project
network = { path = "../network" }
crypto_utils = { path = "../crypto_utils" }
osvauld_core = { path = "../core" }
persistance = { path = "../persistance" }
services = { path = "../services" }

# CLI and async runtime
clap = { version = "4.5.40", features = ["derive"] }
tokio = { version = "1.44.2", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Other utilities
anyhow = "1.0.91"
base64 = "0.22.1"
chrono = "0.4.38"
rpassword = "7.3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
