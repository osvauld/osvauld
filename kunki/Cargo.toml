[package]
name = "kunki"
version = "0.1.0"
edition = "2021"

[lib]
name = "kunki"
path = "src/lib.rs"

[[bin]]
name = "kunki"
path = "src/main.rs"

[features]
default = []
profiling = ["console-subscriber", "tracing-flame"]

[dependencies]
# Profiling (optional)
console-subscriber = { workspace = true, optional = true }
tracing-flame = { workspace = true, optional = true }
# Core crates
gurkha = { path = "../gurkha" }
butler = { path = "../butler" }
herald = { path = "../herald" }
transport = { path = "../transport" }
courier = { path = "../courier" }
control_server = { path = "../control_server", features = ["butler"] }
lua_runtime = { path = "../lua_runtime" }
domains = { path = "../domains" }

# CLI and async runtime
clap = { version = "4.5.40", features = ["derive"] }
tokio = { version = "1.44.2", features = ["full"] }
ractor = "0.14"

# Logging
logging_utils = { path = "../logging_utils" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Other utilities
anyhow = "1.0.91"
base64 = "0.22.1"
chrono = "0.4.38"
rpassword = "7.3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
