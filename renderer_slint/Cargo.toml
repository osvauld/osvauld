[package]
name = "renderer_slint"
version = "0.1.0"
edition = "2021"
description = "Slint renderer for user apps (chat, survey, ecomm)"

[dependencies]
slint = { version = "1.16", features = ["backend-winit", "renderer-femtovg"] }
slint-interpreter = "1.16"
lua_runtime = { path = "../lua_runtime" }
butler = { path = "../butler" }
scribe = { path = "../scribe" }
domains = { path = "../domains" }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
mlua = { version = "0.10", features = ["lua54", "vendored", "async", "send"] }
ractor = "0.14"
rfd = "0.15"
mime_guess = "2"
chrono = "0.4"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
image = "0.25"
