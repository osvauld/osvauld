[package]
name = "osvauld_db"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel_migrations = "2.0.0"
diesel = { version = "2.2.0", features = [
  "sqlite",
  "returning_clauses_for_sqlite_3_35",
  "r2d2",
] }
libsqlite3-sys = { version = "0.25.2", features = [
  "bundled",
  "unlock_notify",
  "min_sqlite_version_3_7_16",
] }
chrono = "0.4.40"
async-trait = "0.1.87"
log = "0.4.26"
serde_json = "1.0.140"
thiserror = "2.0.12"
osvauld_core = { path = "../core" }

tokio = { version = "1.44.0", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
uuid = { version = "1.15.1", features = ["v4"] }
