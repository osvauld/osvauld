[package]
name = "courier"
version = "0.1.0"
edition = "2021"
description = "Actor-based P2P protocol layer for Osvauld"
license = "MIT"

[dependencies]
# Transport layer (dumb byte pipe)
transport = { path = "../transport" }

# Domain crates
domains = { path = "../domains" }
gurkha = { path = "../gurkha" }
butler = { path = "../butler" }
herald = { path = "../herald" }

# Actor framework
ractor = "0.14"

# Async
tokio = { version = "1", features = ["sync", "time", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.22"

# Time
chrono = "0.4"

# Utilities
uuid = { version = "1.11", features = ["v4"] }
hex = "0.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
logging_utils = { path = "../logging_utils" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
proptest = "1.4"
gurkha = { path = "../gurkha", features = ["test-support"] }
