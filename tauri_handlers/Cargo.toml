[package]
name = "tauri_handlers"
version = "0.1.0"
edition = "2024"

[dependencies]
# Tauri
tauri = { version = "2.9.3", features = [] }

# Workspace crates
gurkha = { path = "../gurkha" }
butler = { path = "../butler" }
herald = { path = "../herald" }
transport = { path = "../transport" }
courier = { path = "../courier" }

# UI rendering (TODO: migrate to Slint)
# tauri_renderer_plugin = { path = "../tauri_renderer_plugin" }
# sthalam_sdk = { path = "../sthalam_sdk" }

# Actor framework
ractor = "0.14"

# Async
tokio = { version = "1", features = ["sync", "rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Encoding
base64 = "0.22"

# Locale
sys-locale = "0.3"

# UUID generation
uuid = { version = "1", features = ["v4"] }
