[package]
name = "tauri_handlers"
version = "0.1.0"
edition = "2021"

[dependencies]
# Tauri
tauri = { version = "2", features = [] }

# Workspace crates
gurkha = { path = "../gurkha" }
butler = { path = "../butler" }
herald = { path = "../herald" }
transport = { path = "../transport" }
courier = { path = "../courier" }

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Encoding
base64 = "0.22"

# Locale
sys-locale = "0.3"
ed25519-dalek = "2.2.0"
